name: Test Binance Domains

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Binance Domains
        run: |
          echo "=== Testing Binance Domains ==="
          curl -s -o /dev/null -w "api1.binance.com: %{http_code}\n" "https://api1.binance.com/api/v3/ping"
          curl -s -o /dev/null -w "api2.binance.com: %{http_code}\n" "https://api2.binance.com/api/v3/ping"
          curl -s -o /dev/null -w "api3.binance.com: %{http_code}\n" "https://api3.binance.com/api/v3/ping"
          curl -s -o /dev/null -w "api4.binance.com: %{http_code}\n" "https://api4.binance.com/api/v3/ping"
          curl -s -o /dev/null -w "data-api.binance.vision: %{http_code}\n" "https://data-api.binance.vision/api/v3/ping"
          curl -s -o /dev/null -w "api.binance.us: %{http_code}\n" "https://api.binance.us/api/v3/ping"
          
          echo "=== Testing Binance Futures Domains ==="
          curl -s -o /dev/null -w "fapi.binance.com: %{http_code}\n" "https://fapi.binance.com/fapi/v1/ping"
          curl -s -o /dev/null -w "fapi1.binance.com: %{http_code}\n" "https://fapi1.binance.com/fapi/v1/ping"
          curl -s -o /dev/null -w "fapi2.binance.com: %{http_code}\n" "https://fapi2.binance.com/fapi/v1/ping"
          curl -s -o /dev/null -w "fapi3.binance.com: %{http_code}\n" "https://fapi3.binance.com/fapi/v1/ping"
