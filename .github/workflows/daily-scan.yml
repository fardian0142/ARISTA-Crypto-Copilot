name: Test Exchanges

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Test Binance & MEXC
        run: |
          echo "=== Testing Binance ==="
          curl -s -o /dev/null -w "Binance Status: %{http_code}\n" "https://api.binance.com/api/v3/ping"
          curl -s -o /dev/null -w "Binance Futures Status: %{http_code}\n" "https://fapi.binance.com/fapi/v1/ping"
          
          echo "=== Testing MEXC ==="
          curl -s -o /dev/null -w "MEXC Status: %{http_code}\n" "https://contract.mexc.com/api/v1/contract/ping"
          
          echo "=== Testing Bybit (for comparison) ==="
          curl -s -o /dev/null -w "Bybit Status: %{http_code}\n" "https://api.bybit.com/v5/market/time"
          
          echo "=== Testing Toobit (for comparison) ==="
          curl -s -o /dev/null -w "Toobit Status: %{http_code}\n" "https://api.toobit.com/api/v1/public/time"
