name: Crypto Scan

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect exchange endpoints
        run: |
          echo "════════════════════════════════════════════"
          echo "🔍 Testing Exchange Endpoints from GitHub Actions"
          echo "════════════════════════════════════════════"
          echo ""
          echo "🌍 Runner Info:"
          echo "  Country: $(curl -s --max-time 5 https://ipinfo.io/country || echo 'unknown')"
          echo "  IP: $(curl -s --max-time 5 https://ipinfo.io/ip || echo 'unknown')"
          echo "  City: $(curl -s --max-time 5 https://ipinfo.io/city || echo 'unknown')"
          echo "════════════════════════════════════════════"
          echo ""

          test_endpoint() {
            local name="$1"
            local url="$2"
            echo -n "🔸 $name → "
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            case "$code" in
              200) echo "HTTP $code ✅" ;;
              000) echo "HTTP $code ❌ (timeout/dns)" ;;
              451) echo "HTTP $code ⚠️  (legal block)" ;;
              403) echo "HTTP $code ⚠️  (forbidden)" ;;
              404) echo "HTTP $code ⚠️  (not found)" ;;
              302) echo "HTTP $code ⚠️  (redirect)" ;;
              *)   echo "HTTP $code" ;;
            esac
          }

          echo "════════════════════════════════════════════"
          echo "🥇 OKX (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "OKX Public Instruments"  "https://www.okx.com/api/v5/public/instruments?instType=SWAP"
          test_endpoint "OKX Tickers"             "https://www.okx.com/api/v5/market/tickers?instType=SWAP"
          test_endpoint "OKX Klines BTC"          "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=2H&limit=5"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🥈 Binance (Spot)"
          echo "════════════════════════════════════════════"
          test_endpoint "Binance data-api.vision"  "https://data-api.binance.vision/api/v3/ping"
          test_endpoint "Binance data-api klines"  "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=2h&limit=5"
          test_endpoint "Binance fapi (Futures)"   "https://fapi.binance.com/fapi/v1/ping"
          test_endpoint "Binance api (Spot)"       "https://api.binance.com/api/v3/ping"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🥉 KuCoin (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "KuCoin Contract Active"  "https://api-futures.kucoin.com/api/v1/contracts/active"
          test_endpoint "KuCoin Klines BTC"       "https://api-futures.kucoin.com/api/v1/kline/query?symbol=XBTUSDTM&granularity=120&from=$(date -d '5 hours ago' +%s000)"
          test_endpoint "KuCoin Spot Symbols"     "https://api.kucoin.com/api/v1/symbols"
          test_endpoint "KuCoin Spot Klines BTC"  "https://api.kucoin.com/api/v1/market/candles?type=2hour&symbol=BTC-USDT"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🔷 MEXC (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "MEXC Contract Detail"    "https://contract.mexc.com/api/v1/contract/detail"
          test_endpoint "MEXC Klines BTC"         "https://contract.mexc.com/api/v1/contract/kline/BTC_USDT?interval=Min120&start=$(date -d '5 hours ago' +%s)&end=$(date +%s)"
          test_endpoint "MEXC Spot Symbols"       "https://api.mexc.com/api/v3/defaultSymbols"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🔶 Gate.io (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "Gate Futures Contracts"  "https://api.gateio.ws/api/v4/futures/usdt/contracts"
          test_endpoint "Gate Futures Klines BTC" "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=2h&limit=5"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🟣 Bitget (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "Bitget Contracts"        "https://api.bitget.com/api/v2/mix/market/contracts?productType=USDT-FUTURES"
          test_endpoint "Bitget Klines BTC"       "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=usdt-futures&granularity=2H&limit=5"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🟢 HTX (Huobi) Futures"
          echo "════════════════════════════════════════════"
          test_endpoint "HTX Contract Info"       "https://api.hbdm.com/linear-swap-api/v1/swap_contract_info"
          test_endpoint "HTX Klines BTC"          "https://api.hbdm.com/linear-swap-ex/market/history/kline?contract=BTC-USDT&period=2h&size=5"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🔵 Coinbase (Spot)"
          echo "════════════════════════════════════════════"
          test_endpoint "Coinbase Products"       "https://api.exchange.coinbase.com/products"
          test_endpoint "Coinbase Klines BTC"     "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🟡 Kraken (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "Kraken Futures Instruments" "https://futures.kraken.com/derivatives/api/v3/instruments"
          test_endpoint "Kraken Futures Klines BTC"  "https://futures.kraken.com/derivatives/api/v3/candles?tickType=trade&symbol=PF_XBTUSD&interval=2h"
          echo ""

          echo "════════════════════════════════════════════"
          echo "🟠 Bybit (Futures)"
          echo "════════════════════════════════════════════"
          test_endpoint "Bybit Instruments"       "https://api.bybit.com/v5/market/instruments-info?category=linear&limit=5"
          test_endpoint "Bybit Klines BTC"        "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=120&limit=5"
          echo ""

          echo "════════════════════════════════════════════"
          echo "⚪ Toobit (Spot)"
          echo "════════════════════════════════════════════"
          test_endpoint "Toobit ExchangeInfo v1"  "https://api.toobit.com/quote/v1/exchangeInfo"
          test_endpoint "Toobit Symbols v2"       "https://api.toobit.com/api/v1/exchangeInfo"
          test_endpoint "Toobit Tickers"          "https://api.toobit.com/quote/v1/tickers"
          echo ""

          echo "════════════════════════════════════════════"
          echo "✅ Testing Complete"
          echo "════════════════════════════════════════════"

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/scan.js

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/signals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update signals cache [skip ci]"
            git push
          fi
