name: Crypto Scan

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect Binance endpoint
        id: binance_check
        run: |
          echo "════════════════════════════════════════════"
          echo "🔍 Testing Binance endpoints from GitHub Actions"
          echo "════════════════════════════════════════════"
          echo ""

          ENDPOINTS=(
            "https://fapi.binance.com/fapi/v1/ping"
            "https://fapi1.binance.com/fapi/v1/ping"
            "https://fapi2.binance.com/fapi/v1/ping"
            "https://fapi3.binance.com/fapi/v1/ping"
            "https://fapi4.binance.com/fapi/v1/ping"
            "https://data-api.binance.vision/api/v3/ping"
            "https://api.binance.com/api/v3/ping"
            "https://api1.binance.com/api/v3/ping"
            "https://api2.binance.com/api/v3/ping"
            "https://api3.binance.com/api/v3/ping"
            "https://api4.binance.com/api/v3/ping"
            "https://fapi.binance.us/fapi/v1/ping"
            "https://api.binance.us/api/v3/ping"
          )

          WORKING=""
          for url in "${ENDPOINTS[@]}"; do
            echo -n "🔸 $url → "
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$url" || echo "000")
            echo "HTTP $CODE"

            if [ "$CODE" = "200" ]; then
              if [ -z "$WORKING" ]; then
                WORKING="$url"
                echo "   ✅ WORKING! (first working endpoint)"
              else
                echo "   ✅ also working"
              fi
            fi
          done

          echo ""
          echo "════════════════════════════════════════════"

          if [ -n "$WORKING" ]; then
            echo "✅ Found working endpoint: $WORKING"
            echo "binance_url=$WORKING" >> $GITHUB_OUTPUT
            echo "binance_available=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No working Binance endpoint found"
            echo "binance_available=false" >> $GITHUB_OUTPUT
          fi

          echo "════════════════════════════════════════════"
          echo ""
          echo "🌍 Runner info:"
          echo "  Country: $(curl -s --max-time 5 https://ipinfo.io/country || echo 'unknown')"
          echo "  IP: $(curl -s --max-time 5 https://ipinfo.io/ip || echo 'unknown')"
          echo "  City: $(curl -s --max-time 5 https://ipinfo.io/city || echo 'unknown')"
          echo "════════════════════════════════════════════"

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/scan.js

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/signals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update signals cache [skip ci]"
            git push
          fi
